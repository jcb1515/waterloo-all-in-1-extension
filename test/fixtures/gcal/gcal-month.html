<!DOCTYPE html>
<!-- Synthetic Google Calendar Month view. The second chip has no
     aria-label — the label lives on a descendant span. -->
<html>
  <body>
    <a aria-label="Google Account: Jane Student (jane.student@example.com)" href="https://accounts.google.com/">J</a>
    <div role="main">
      <div data-eventid="ZXZ0MDA1IGZyaWVuZEBleGFtcGxlLm9yZw"
           aria-label="6pm to 7pm, Dinner, Friend Name, October 2, 2026"></div>
      <div data-eventid="ZXZ0MDA4IGZlZWQxMjNAaW1wb3J0LmNhbGVuZGFyLmdvb2dsZS5jb20=">
        <span>All day, Hackathon week, October 5 – 9, 2026</span>
      </div>
    </div>
  </body>
</html>
